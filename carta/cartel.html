    .qr { margin-top: 7mm; width: 74mm; height: 74mm; padding: 3mm; background: #fff; border-radius: 6mm; border: .4mm solid rgba(58,31,20,.22); }
    .qr svg { display: block; width: 100%; height: 100%; }

    .foot strong { color: var(--choco); }
    @media print { html, body { background: none; padding: 0; } .hint { display: none; } .sheet { box-shadow: none; margin: 0; } }
